name: drinkup
description: "DrinkUp — cocktail explorer powered by TheCocktailDB."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  cached_network_image: ^3.4.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.2
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/favicon.png"
  adaptive_icon_foreground: "assets/images/favicon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: CuteDino
      fonts:
        - asset: assets/fonts/cute_dino.ttf
