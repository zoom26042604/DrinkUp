name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printenv GOOGLE_SERVICES > android/app/google-services.json

      - name: Write firebase_options.dart
        env:
          FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: printenv FIREBASE_OPTIONS > lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/DrinkUp-${{ github.ref_name }}-arm64.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/DrinkUp-${{ github.ref_name }}-arm32.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/DrinkUp-${{ github.ref_name }}-x86_64.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DrinkUp ${{ github.ref_name }}
          body: |
            ## DrinkUp ${{ github.ref_name }}

            ### Quel APK choisir ?
            - **arm64** → téléphones récents (2018+), le bon dans 99% des cas
            - **arm32** → vieux téléphones
            - **x86_64** → émulateurs

            ### Installation
            1. Télécharge le fichier `.apk` correspondant à ton téléphone (arm64 si tu sais pas)
            2. Sur ton Android, autorise les sources inconnues dans les paramètres
            3. Lance le fichier et installe l'app
          files: |
            build/app/outputs/flutter-apk/DrinkUp-${{ github.ref_name }}-arm64.apk
            build/app/outputs/flutter-apk/DrinkUp-${{ github.ref_name }}-arm32.apk
            build/app/outputs/flutter-apk/DrinkUp-${{ github.ref_name }}-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
